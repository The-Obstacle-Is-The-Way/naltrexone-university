minimumReleaseAge: 10080
minimumReleaseAgeStrict: true # v11-only: fail when no version satisfies the 7-day age threshold.
minimumReleaseAgeIgnoreMissingTime: false # v11-only: fail when registry metadata lacks package publish time.
blockExoticSubdeps: true
overrides:
  # Security: GHSA-r28c-9q8g-f849 + GHSA-fxqj-rqcc-2cmp — crafted
  # sourceMappingURL paths could disclose arbitrary .map files, including when
  # PostCSS has no `from` value. Build-only via Next/Tailwind/Vite over trusted
  # repo CSS, so defense-in-depth. 8.5.23 satisfies Tailwind's ^8.5.16 and
  # Vite's ^8.5.23; Next pins 8.4.31 exactly, so this existing override remains
  # intentionally out-of-range but within PostCSS 8. Aged past the 7-day gate
  # as of 2026-08-07 (published 2026-07-24).
  postcss: 8.5.23
  uuid: 14.0.0
  # Security: GHSA-q8mj-m7cp-5q26 (CVE-2026-8723; alert #64) — qs.stringify
  # throws on null/undefined entries in comma-format arrays with
  # encodeValuesOnly; GHSA-4mjr-xmp4-gh2g — stringify calls an attacker-set,
  # non-callable constructor.isBuffer; GHSA-x5fp-wj9c-mxmx — bracket keys bypass
  # arrayLimit when comma parsing is on. All three are DoS or limit bypasses,
  # fixed together in 6.16.0. Dev-only: typed-rest-client@2.3.1 pins qs 6.15.1
  # exactly for Stryker's dashboard reporter, which this repo does not
  # configure, so defense-in-depth; 6.16.0 is a semver-minor step on the same
  # API. Aged past the 7-day gate (published 2026-08-29).
  qs: 6.16.0
  esbuild: '>=0.28.1'
  # Security: GHSA-8xcm-r25x-g524, GHSA-4cwx-7wf7-3272,
  # GHSA-jr45-8vmc-qm54, GHSA-v3r7-h72x-cjcm, and GHSA-m8rv-5g2x-5cg5 —
  # response-desync, cache disclosure/crash, cookie-attribute injection, and
  # CRLF-injection flaws, fixed in 7.29.0. Alerts #68, #70, #71, #74, #75 and
  # #76 (GHSA-w293-vg96-wgc3, GHSA-pmjh-fq2x-6v4x, GHSA-2gqq-gqf2-x968,
  # GHSA-r53p-7pc4-xj5r, GHSA-2jfj-6hjv-fm6j, GHSA-8436-99hf-9mmv) — a
  # BalancedPool TLS-validation bypass, a RetryHandler DoS, and cache, retry and
  # dump-interceptor flaws — are fixed in 7.29.1. Dev-scoped via jsdom/vitest,
  # so defense-in-depth. 7.29.1 satisfies jsdom's ^7.25.0. Aged past the 7-day
  # gate (published 2026-09-04).
  undici: 7.29.1
  # Security: GHSA-2883-xcg3-v3hh (CVE-2026-84375) — maxTotalMergeKeys did not
  # bound CPU for empty merge sources; the earlier GHSA-h67p-54hq-rp68 +
  # GHSA-5p4m-2wfm-xmqj alias/!!omap quadratic-CPU fixes remain covered.
  # Transitive via gray-matter and Clerk's react-native/istanbul test tooling
  # over first-party YAML/Markdown only, so defense-in-depth. Alert #63
  # retargeted the v3-legacy line from 3.15.1 to 3.15.2, which satisfies both
  # consumers' ^3.13.1 (DEBT-476). Aged past the 7-day gate as of 2026-09-02
  # (published 2026-08-26).
  js-yaml: 3.15.2
  # Security: GHSA-mh99-v99m-4gvg + GHSA-rgw5-rvv9-x895 — unbounded brace
  # expansion could allocate oversized intermediate arrays and exhaust memory;
  # GHSA-6j4f-fj2g-mc7p + GHSA-qhr7-859c-m2p7 — uncontrolled recursion; and
  # GHSA-q2hr-2g5m-vwhr — quadratic-time `{a},b}` rewriting. All DoS, fixed
  # together in 5.0.12. Build/test globs are repository-controlled. Scoped to
  # minimatch@10's 5.x line; 5.0.12 satisfies ^5.0.8. Aged past the 7-day gate
  # (published 2026-09-14).
  'brace-expansion@5': 5.0.12
  # Security: GHSA-mh99-v99m-4gvg + GHSA-rgw5-rvv9-x895, GHSA-6j4f-fj2g-mc7p +
  # GHSA-qhr7-859c-m2p7 and GHSA-q2hr-2g5m-vwhr — the same flaws affect
  # minimatch@3's independent 1.x dependency line, fixed together in 1.1.21.
  # Build/test globs are repository-controlled. 1.1.21 satisfies ^1.1.7 and is
  # deliberately scoped away from the 5.x override. Aged past the 7-day gate
  # (published 2026-09-14).
  'brace-expansion@1': 1.1.21
  # Security: GHSA-5jgf-p345-68v8 + GHSA-fph4-wmhf-6fwf + GHSA-f65p-4m7j-42xc +
  # GHSA-jqff-g426-hqxp — host confusion / SSRF via IDN, percent-decoding, IPv6,
  # and percent-encoded scheme (fixed in 3.1.6), plus GHSA-qw65-cvwx-89v3 +
  # GHSA-58mr-gqgx-xq4g — port authority injection and unbalanced IP-literal
  # brackets (fixed in 3.1.7). Transitive through ajv under Sentry's webpack
  # path; this Turbopack build does not execute that path, so defense-in-depth
  # (issue #703). Alerts #51-#54 retargeted 3.1.5 to 3.1.7, which satisfies
  # ajv's ^3.0.1 (DEBT-476). The 3.1.8 follow-up also fixes
  # GHSA-hrr3-gc8f-f4qj (host case normalization, medium). Published
  # 2026-09-15T07:36:25.444Z; the unchanged 7-day gate cleared at
  # 2026-09-22T07:36:25.444Z. No maturity or trust exception is needed.
  fast-uri: 3.1.8
  # Security: GHSA-2v37-7h3g-55p8 — custom nanoid generators can loop
  # indefinitely when size is zero. The 2026-08-14 advisory revision moved the
  # patched floor to 3.3.18. Transitive via postcss@8.5.23 (build-time CSS
  # tooling under Tailwind/Next); no direct usage, so defense-in-depth. Scoped
  # to the 3.x line; 3.3.18 satisfies postcss's ^3.3.16. Aged past the 7-day
  # gate 2026-08-14T16:41:05Z (published 2026-08-07T16:41:05Z).
  'nanoid@3': 3.3.18
  # Security: GHSA-f88m-g3jw-g9cj — sharp < 0.35.0 bundles a libvips affected by
  # four inherited CVEs (memory-safety on untrusted image input): CVE-2026-33327
  # (VIPS dimension overflow), CVE-2026-33328 (GIF integer overflow, 32-bit),
  # CVE-2026-35591 (TIFF tile-channel handling), CVE-2026-35590 (EXIF range
  # validation). Patched in sharp 0.35.0 (libvips 8.18.3); the exact pin is
  # now 0.35.5 (below). Next 16.3.4 itself declares ^0.35.4: it re-enabled AVIF
  # optimization only once sharp 0.35.4 shipped the libheif 1.23.2 fix for
  # GHSA-2xp9-vwfh-vxw4 (unauthenticated AVIF RCE in Image Optimization). The
  # exact pin stays as defense-in-depth so no transitive range can resolve
  # below that patched floor.
  # No reachable attacker path here today: no next/image usage, no
  # images.remotePatterns in next.config.ts, no direct sharp import, no image
  # upload — so this is defense-in-depth for the installed binary and any future
  # self-hosted `next start` image optimization (on Vercel, /_next/image uses
  # Vercel's own pipeline, not this sharp). Next's optimizer touches only
  # surviving 0.35 APIs (metadata/resize/rotate/format/toBuffer), none of the
  # removed surface (failOnError, paletteBitDepth, format.jp2k).
  # GHSA-wq5f-xc86-pv6w (alert #83) then moved the floor to 0.35.5: the bundled
  # librsvg had a memory-safety flaw (CVE-2026-96889) reachable through SVG
  # decoding, with possible RCE on glibc Linux. 0.35.5 ships librsvg 2.63.2 in
  # libvips 8.18.7 (the @img/sharp-libvips 1.3.4 packages) and is a patch
  # release on the same API. Aged past the 7-day release gate (0.35.5 and its
  # @img packages published 2026-09-27).
  sharp: 0.35.5
packageExtensions:
  # DEBT-460 Cleanup A (issue #813): Stryker's sandbox TSConfigPreprocessor runs
  # `import('typescript')` and calls the classic compiler API
  # (parseConfigFileTextToJson), but declares no `typescript` dependency, so it
  # would otherwise resolve the root TypeScript 7, whose package root exports
  # only version metadata. Declaring the real typescript 6 package gives it the
  # same compiler @typescript/typescript6 wraps, with no npm: alias. Remove this
  # when Stryker declares or stops needing TypeScript. Dependabot does not update
  # this range. Keep it on the same major as @typescript/typescript6; the
  # lockfile, not the range, keeps both on one typescript@6 package.
  '@stryker-mutator/core':
    dependencies:
      typescript: ^6.0.3
  # DEBT-506: these three packages, reached through @clerk/ui's Solana wallet
  # adapters, declare react-native as a required peer, but only their React
  # Native entry points (index.native.js, the `react-native` export condition)
  # import it; the browser and node entries Next.js resolves never do. pnpm
  # installs a missing required peer by itself, which put react-native and its
  # Metro, Jest and Babel tooling into this web app's install graph, shell-quote
  # (alert #82) among them. Marking the peer optional stops that install and
  # removes or stubs no Clerk or Solana package. A React Native host would
  # still supply the peer. tests/dependency-graph-policy.test.ts fails if
  # react-native returns.
  '@react-native-async-storage/async-storage':
    peerDependenciesMeta:
      react-native:
        optional: true
  '@solana-mobile/mobile-wallet-adapter-protocol':
    peerDependenciesMeta:
      react-native:
        optional: true
  '@solana-mobile/wallet-adapter-mobile':
    peerDependenciesMeta:
      react-native:
        optional: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1 # legacy Babel dependency published in 2023; exact exception for no-downgrade provenance gap.
  - tinyexec@1.2.2 # already-shipped Vite/Vitest utility; exact exception for no-downgrade provenance gap.
strictDepBuilds: true
allowBuilds:
  '@clerk/shared': false # postinstall prints telemetry notice and persists telemetryNoticeVersion to local Clerk config.
  '@stripe/cli': true # installs the pinned official Stripe CLI binary used by the required provider-backed Checkout contract.
  bufferutil: false # optional ws peer/native performance addon built by node-gyp-build; ws can fall back.
  core-js: false # postinstall prints support/funding banner with temp-file dedupe; no build artifact.
  esbuild: true # validates/prepares platform esbuild binaries used by Vite, tsx, and Drizzle tooling.
  sharp: true # verifies/builds the native image-processing addon used by Next's image pipeline.
  utf-8-validate: false # optional ws peer/legacy UTF-8 native addon built by node-gyp-build; Node 24/ws can fall back.
