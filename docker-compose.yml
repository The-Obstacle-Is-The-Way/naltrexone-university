# Local development database for integration tests
# Usage: docker compose up -d
# Matches CI's database: the same image digest, credentials and health check
# as scripts/ci/start-postgres.sh (DEBT-516).

services:
  db:
    # postgres:16 (PostgreSQL 16.15), pinned to the digest CI pulls; the two
    # change together (docs/dev/dependency-update-protocol.md).
    image: postgres@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: addiction_boards_test
    ports:
      - '${DB_TEST_PORT:-5434}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d addiction_boards_test']
      interval: 5s
      timeout: 5s
      retries: 10
