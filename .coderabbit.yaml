# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit Configuration for Naltrexone University
# See: https://docs.coderabbit.ai/reference/configuration

language: en-US

tone_instructions: |
  Be direct and technical. Focus on correctness, risk, and repo conventions over praise.
  Do not suggest JSDoc or docstrings for TypeScript unless a file already uses that pattern.

early_access: false

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  review_details: true
  auto_review:
    enabled: true
    # CodeRabbit auto-reviews the default branch automatically.
    # `.*` matches every additional non-default PR base branch.
    base_branches:
      - '.*'
    drafts: false
    # Review only what can merge (ADR-024, owner, 2026-10-06): the included
    # allowance is per developer identity, which every agent session shares,
    # and only the final head's approval counts. A PR is reviewed when it opens
    # or a draft is marked ready, and later on `@coderabbitai full review`.
    auto_incremental_review: false
    # Promotions (dev → main) carry only source PRs already approved on their
    # exact heads, and need no review of their own (ADR-024; owner, 2026-09-22
    # and 2026-10-04). Every promotion title
    # begins "Promote #". Matching is a case-insensitive substring.
    ignore_title_keywords:
      - 'Promote #'
  pre_merge_checks:
    docstrings:
      mode: off
  path_instructions:
    # Domain Layer - Pure business logic, no external dependencies
    - path: "src/domain/**"
      instructions: |
        This is the DOMAIN layer (Clean Architecture innermost layer).
        MUST have ZERO external dependencies - only pure TypeScript.
        Entities must not contain vendor IDs (Clerk, Stripe).
        Value objects must be immutable with factory functions.
        Domain services must be pure functions.
        All domain code MUST be 100% unit testable without mocks.

    # Application Layer - Use cases and ports
    - path: "src/application/**"
      instructions: |
        This is the APPLICATION layer (use cases + ports).
        Dependencies flow INWARD only (can import from domain/).
        Use cases orchestrate, they don't implement business rules.
        Ports (interfaces) define contracts for adapters.
        Tests should use fakes from src/application/test-helpers/fakes/, NOT vi.mock().

    # Adapters Layer - Implementations
    - path: "src/adapters/**"
      instructions: |
        This is the ADAPTERS layer (repositories, gateways, controllers).
        Implements ports defined in application layer.
        Controllers handle validation, error mapping, and orchestration.
        Repositories wrap database operations.
        Gateways wrap external services (Clerk, Stripe).
        Tests MUST follow the canonical test-double rule in .claude/rules/testing.md.
        A Drizzle/SDK call-chain object is not a fake; verify shape-only stubs,
        behavioral fakes, contracts, and real-infrastructure coverage by that rule.

    # Test files - Vitest conventions
    - path: "**/*.test.ts"
      instructions: |
        TESTING CONVENTIONS (Vitest, NOT Jest):
        1. Apply the single taxonomy, shape-vs-behavior decision rule, and exceptions
           in .claude/rules/testing.md; do not infer a double's kind from its variable name.
        2. Do not allow growth past tests/test-double-fidelity-ratchet-floors.ts.
        3. One concept per test, use Arrange-Act-Assert pattern
        4. Test behavior, not implementation details
        5. Use factories: createQuestion(), createChoice() from test-helpers/
        6. Do NOT require dynamic import()/beforeAll loading in pure TypeScript *.test.ts suites.
           That React 19 compatibility rule is scoped to **/*.test.tsx component tests.
        7. FIXTURE IDs (see .claude/rules/fixture-integrity.md): in fakes-only
           application/domain/use-case tests, readable string IDs such as 'q1',
           'user-1', or 'attempt-1' are INTENTIONAL and correct — do NOT suggest
           replacing them with UUIDs or crypto.randomUUID(). UUID-shaped fixtures are
           required ONLY where an ID crosses a zUuid/Drizzle uuid() boundary, which is
           covered in adapter/controller tests (those legitimately assert UUID shape and
           the 'not-a-uuid' rejection path). Flagging readable fake-backed IDs in
           fakes-only tests is a known recurring false positive in this repo.

    # React component tests - React 19 specific
    - path: "**/*.test.tsx"
      instructions: |
        REACT 19 + VITEST REQUIREMENTS:
        1. MUST have "// @vitest-environment jsdom" as FIRST LINE
        2. Use renderToStaticMarkup from react-dom/server for render tests
        3. DO NOT use @testing-library/react (broken with React 19)
        4. DO NOT use react-test-renderer (deprecated in React 19)
        5. Interactive or async UI tests belong in *.browser.spec.tsx, not here

    - path: "**/*.browser.spec.tsx"
      instructions: |
        Browser mode tests use vitest-browser-react and run with pnpm test:browser.
        Use real browser interactions and async expectations.
        Do not suggest @testing-library/react or jsdom-only interaction patterns here.

    - path: "tests/skip-policy-source-scan*.ts"
      instructions: |
        This scanner prevents accidental test-control drift by cooperating authors.
        Direct Vitest/Playwright receivers are classified, known non-framework imports
        are ignored, and every unclassified receiver fails closed as a violation.
        Do not suggest alias, shadowing, reassignment, destructuring, or temporal
        data-flow resolution merely to label an input that the scanner already rejects.
        Report a gap only when current code can admit an unapproved control or reject a
        clearly non-framework import.

    # E2E tests - Playwright
    - path: "tests/e2e/**"
      instructions: |
        E2E tests use Playwright.
        Use waitForURL() or waitForNavigation() before checking page.url().
        Avoid race conditions with synchronous URL checks after navigation.

    # Next.js App Router
    - path: "app/**"
      instructions: |
        Next.js App Router with Server Components and Server Actions.
        Server Actions must be in files with 'use server' directive.
        Client components must have 'use client' directive.
        Use composition root pattern - wire dependencies at entry points.

    # Database schema
    - path: "db/**"
      instructions: |
        Drizzle ORM schema and migrations.
        Schema changes require running pnpm db:generate.
        Tables should have appropriate indexes for query patterns.

    # Migration SQL runs in the Vercel build before the new deployment serves.
    - path: "db/migrations/*.sql"
      instructions: |
        Review against docs/guides/database/migrations.md. Applied migrations are
        immutable: flag any edit to an existing file. For a new file, check:
        every statement is safe while the previous (N-1) deployment still
        serves; data cleanup or backfill runs before the constraint that
        depends on it; lock scope is stated in a comment for live tables
        (FOREIGN KEY adds on growing tables use NOT VALID, with VALIDATE
        later); data-mutating statements log affected-row counts with
        RAISE NOTICE; and constraint names match the exported constants in
        db/schema.ts.

    # DEBT-515: record conventions live in docs/records/README.md, reviewed
    # with the code. A learning stored from #285 (2026-04-25) told CodeRabbit
    # that a bug record keeps "Status: Open" with a "Resolution State" field
    # until after merge, the opposite of today's lifecycle, and it was still
    # applied on #1456 (2026-10-10).
    - path: "docs/records/**"
      instructions: |
        Review bug and debt records against docs/records/README.md, "How
        Records Work". It governs status and closure, over any stored learning:
        - Statuses are Open, In Progress, Blocked, or "Verifying — <the
          remaining check>; due YYYY-MM-DD". There is no "Resolution State"
          field.
        - When a fix merges but a check remains that only promotion or
          production can satisfy, the fixing PR itself sets Verifying,
          effective when it merges.
        - Once that check is recorded, the next PR that touches
          docs/records/ deletes the record and adds its line to
          docs/records/closed.md, the ledger.
        - Only docs/records/README.md links records; elsewhere a record is
          cited by its ID.
        If a stored learning conflicts with that section, follow it and name
        the learning that conflicts.

  finishing_touches:
    docstrings:
      enabled: false
  path_filters:
    - "!**/node_modules/**"
    - "!**/pnpm-lock.yaml"
    - "!**/.next/**"
    - "!**/dist/**"
    # Review migration SQL; skip only drizzle-kit's generated snapshots and
    # journal (ADR-021 adds a migration per increment).
    - "!db/migrations/meta/**"
    # Temporary, DEBT-518 step 5: the archive purge deletes about 1,470 files
    # here, ten times the per-review file limit. CodeRabbit reads this file
    # from the pull request's head, so the purge keeps these lines and the
    # pull request after it removes them.
    - "!docs/_archive/**"
    - "!docs/bugs/assets/**"
    - "!docs/debt/assets/**"
    - "!docs/audits/assets/**"

  # Focus on these tools
  tools:
    biome:
      enabled: true
    eslint:
      enabled: false  # We use Biome, not ESLint

chat:
  enabled: true
  auto_reply: true

knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    # A guideline file applies only to its own folder unless `applyTo` maps
    # it (docs.coderabbit.ai/knowledge-base/code-guidelines), so each
    # path-scoped rule maps to the globs in its `paths:` front matter, and a
    # rule with none to every file. tests/agent-instructions.test.ts keeps the
    # two in step. Root AGENTS.md and CLAUDE.md are defaults.
    filePatterns:
      - files: ".claude/rules/testing.md"
        applyTo: "**/*"
      - files: ".claude/rules/architecture.md"
        applyTo: "src/**"
      - files: ".claude/rules/domain-layer.md"
        applyTo: "src/domain/**"
      - files: ".claude/rules/frontend.md"
        applyTo: "{app/**,components/**}"
      - files: ".claude/rules/testing-react19.md"
        applyTo: "**/*.test.tsx"
      - files: ".claude/rules/testing-browser.md"
        applyTo: "**/*.browser.spec.tsx"
      - files: ".claude/rules/test-isolation.md"
        applyTo: "{**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,tests/**,src/**/test-helpers/**,**/*-test-helpers.ts,**/*-test-helpers.tsx,**/*.fixtures.ts}"
      - files: ".claude/rules/fixture-integrity.md"
        applyTo: "{**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,tests/**,src/**/test-helpers/**,**/*-test-helpers.ts,**/*-test-helpers.tsx,**/*.fixtures.ts}"
      - files: "docs/design-system/standards.md"
        applyTo: "{app/**,components/**}"
      # The records rules govern docs/records/**, the folder this file is in.
      - "docs/records/README.md"
  # DEBT-515: agents comment as the owner, so a learning drawn from their chat
  # would apply to every later review as if the owner had ruled. Each new
  # learning waits up to 30 days (the maximum) for the owner to approve or
  # reject it in CodeRabbit's app; one left alone applies when the 30 days end,
  # with no notice, so the weekly coderabbit-learnings-review workflow lists
  # them in a GitHub issue. Reviewer rules belong in AGENTS.md, through a PR.
  learnings:
    scope: auto
    approval_delay: 30
  issues:
    scope: auto
  jira:
    usage: disabled
  linear:
    usage: disabled
