name: Stripe hosted Checkout compatibility

# Stripe documents Checkout UI automation as unsupported. This workflow is an
# observational compatibility probe only; it never runs as a pull-request or
# push check and must not be configured as a required merge status.
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stripe-hosted-checkout-smoke
  cancel-in-progress: false

jobs:
  hosted-checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/addiction_boards_test
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # DEBT-516: the first of Docker Hub, ECR Public and Google's mirror that
      # serves this digest. Refresh it with docker-compose.yml's, per
      # docs/dev/dependency-update-protocol.md.
      - name: Start Postgres
        run: bash scripts/ci/start-postgres.sh
        timeout-minutes: 12
        env:
          POSTGRES_IMAGE_DIGEST: sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5 # postgres:16, PostgreSQL 16.15

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Migrate DB
        run: pnpm exec tsx scripts/internal/run-managed-db-migrate.ts

      - name: Seed DB (placeholder content)
        run: pnpm exec tsx scripts/internal/run-managed-db-seed.ts
        env:
          SEED_INCLUDE_PLACEHOLDERS: 'true'

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SKIP_CLERK: 'false'
          CLERK_SECRET_KEY: sk_test_dummy
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: sk_test_dummy
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          NEXT_PUBLIC_STRIPE_PRICE_ID_MONTHLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ID_MONTHLY }}
          NEXT_PUBLIC_STRIPE_PRICE_ID_ANNUAL: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ID_ANNUAL }}

      - name: Install Chromium
        timeout-minutes: 12
        run: bash scripts/ci/install-playwright-chromium.sh

      - name: Run observational Stripe-hosted Checkout journeys
        id: hosted_e2e
        run: pnpm test:e2e:stripe-hosted
        env:
          NEXT_PUBLIC_SKIP_CLERK: 'false'
          E2E_USE_EXISTING_DATABASE: 'true'
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PRICE_ID_MONTHLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ID_MONTHLY }}
          NEXT_PUBLIC_STRIPE_PRICE_ID_ANNUAL: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ID_ANNUAL }}
          E2E_CLERK_USER_USERNAME: ${{ secrets.E2E_CLERK_USER_USERNAME }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
          E2E_STRIPE_OWNER: github-stripe-hosted-smoke

      # BUG-328: every HTML report carries Clerk development tokens from the
      # setup steps, so it is never uploaded. A failed run uploads its failure
      # output only after this scan finds no token in it.
      - name: Scan Playwright output
        id: playwright_output_scan
        if: ${{ !cancelled() && steps.hosted_e2e.outcome == 'failure' }}
        run: pnpm exec tsx scripts/ci/scan-playwright-output.ts test-results

      - name: Upload Playwright failure output
        if: ${{ !cancelled() && steps.hosted_e2e.outcome == 'failure' && steps.playwright_output_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stripe-hosted-checkout-test-results
          path: |
            test-results/
            !**/.auth/**
            !**/trace.zip
          retention-days: 30
          if-no-files-found: ignore

      # DEBT-516: the runner printed a service container's log after the job;
      # Start Postgres runs the database itself, so this step prints it.
      - name: Postgres log
        if: ${{ !cancelled() }}
        run: docker logs postgres || true
