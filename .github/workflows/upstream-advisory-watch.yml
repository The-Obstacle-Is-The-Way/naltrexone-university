name: Upstream advisory watch

# Dependabot alerts come from GitHub's advisory database, and an upstream
# advisory reaches it late or never (DEBT-509: Next.js's 2026-09-30 advisories
# took a week). This job reads the published advisories of every repository
# behind pnpm-lock.yaml, about 465, and opens one issue per new advisory.
# GitHub starts this repository's scheduled runs hours late. A steady delay
# does not slow detection, but the gap between runs does, so the job is due
# every three hours. A run uses about half of the token's 1,000 requests an
# hour, so two delayed runs fit in one hour; a third would stop, saying so.
# Nothing else in this repository calls the API. To catch an announced fix at
# once, run it by hand. See docs/dev/supply-chain-overrides.md.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-advisory-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Raise new upstream advisories
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/upstream-advisory-watch.ts
