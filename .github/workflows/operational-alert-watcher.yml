name: Operational alert watcher

# DEBT-505: operational alerts, the legal-deadline renewal alerts among them,
# reach the owner as Sentry email, and nothing in that path notices its own
# absence. This daily job reads Sentry after the renewal job's 09:00 UTC run
# and keeps one issue open while a check fails. The checks:
# docs/dev/logging.md, "Operational alerts", Watcher.
on:
  schedule:
    - cron: '37 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-alert-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # The Sentry token is read-only and reaches this step alone.
      - name: Check the operational alert path
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SENTRY_WATCHER_TOKEN: ${{ secrets.SENTRY_WATCHER_TOKEN }}
        run: pnpm exec tsx scripts/operational-alert-watcher.ts
