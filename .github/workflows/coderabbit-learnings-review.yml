name: CodeRabbit learnings review

# CodeRabbit turns pull-request chat into learnings, rules it applies to every
# later review. Agents comment as the owner, so an agent's argument can become
# a rule nobody reviewed. `.coderabbit.yaml` holds each new learning for 30
# days, then applies it unless the owner rejects it, and CodeRabbit sends no
# notice. This weekly job keeps one issue listing the week's learnings, those
# that tell CodeRabbit to stop raising something first. See AGENTS.md,
# CodeRabbit Learnings, and DEBT-515.
on:
  schedule:
    - cron: '29 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coderabbit-learnings-review
  cancel-in-progress: false

jobs:
  learnings-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: List the week's CodeRabbit learnings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: pnpm exec tsx scripts/coderabbit-learnings-review.ts
