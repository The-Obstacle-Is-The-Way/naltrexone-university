name: Upstream fix watch

# A workaround waiting for an upstream fix gets no Dependabot pull request
# when the fix ships (DEBT-500). Weekly, this job raises one issue, assigned to
# the repository owner, for each watched fix that has landed and been released.
# The watches are in scripts/watchers/upstream-fix-watch.ts.

on:
  schedule:
    - cron: '41 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-fix-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Raise released upstream fixes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: pnpm exec tsx scripts/watchers/upstream-fix-watch.ts
