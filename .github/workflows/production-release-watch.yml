name: Production release watch

# DEBT-523: production can lag main with nothing reporting it. GitHub dropped
# the push of promotion #1523's merge commit, leaving it with no CI run and no
# deployment, and Vercel created no production deployment for #509 and #1367.
# Hourly, this job keeps one issue, assigned to the repository owner, open
# while main's head has no passing CI run on main, a push run or a manual one,
# or no successful production deployment. The checks are in
# scripts/production-release-watch.ts.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      deployments: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Check that production serves main's head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: pnpm exec tsx scripts/production-release-watch.ts
