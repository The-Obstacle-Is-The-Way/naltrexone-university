name: CI

on:
  pull_request:
  push:
    branches: [main]
  # DEBT-523: for a push to main that GitHub never processed, which leaves
  # the commit with no CI run and no deployment. The run's result is the
  # evidence for the manual release route in
  # docs/guides/release/promote-to-production.md (No production deployment at all).
  workflow_dispatch:
    inputs:
      sha:
        description: "The full SHA of main's head, the commit whose push GitHub dropped"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # A manual run waits for an in-progress push run on main instead of
  # canceling it: that push run may be a newer promotion's release check.
  # Any later push-event run, a re-run included, cancels a manual one. Usually
  # main has then moved on, and the newer head's push run is the release
  # check; otherwise dispatch the manual run again.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/addiction_boards_test
      DB_TEST_PORT: '5432'

      # App base URL used by redirects / Playwright baseURL
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      # A manual run is only for main's dropped commit. On a branch, or once
      # main has moved on, it would spend a full E2E run on the shared Clerk
      # test user for no release. The run's SHA is fixed at dispatch, and the
      # run can then wait behind a push run, so main's head is read again
      # here. The repository is public, so the read needs no credential, and
      # an unreadable head refuses the run.
      - name: Refuse a manual run off main's dropped commit
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 2
        env:
          GIT_TERMINAL_PROMPT: '0'
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          # The input is printed in a workflow command below, so it must be a
          # full SHA first: a newline in it could start a command of its own.
          if ! [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Manual CI runs only on main's head::The sha input is not a full 40-character commit SHA."
            exit 1
          fi
          main_head=$(git ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1) || main_head=''
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_SHA" = "$REQUESTED_SHA" ] && [ "$main_head" = "$REQUESTED_SHA" ]; then
            exit 0
          fi
          echo "::error title=Manual CI runs only on main's head::This run is on ${GITHUB_REF} at ${GITHUB_SHA}, the requested commit is ${REQUESTED_SHA}, and main's head is ${main_head:-unreadable}. Dispatch on main with main's current head SHA."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # DEBT-516: the first of Docker Hub, ECR Public and Google's mirror that
      # serves this digest. Refresh it with docker-compose.yml's, per
      # docs/guides/dependencies/updating-dependencies.md.
      - name: Pull Postgres
        run: bash scripts/ci/pull-image.sh --env POSTGRES_IMAGE_REPOSITORY Postgres "$POSTGRES_IMAGE_DIGEST" docker.io/library/postgres public.ecr.aws/docker/library/postgres mirror.gcr.io/library/postgres
        timeout-minutes: 12
        env:
          POSTGRES_IMAGE_DIGEST: sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5 # postgres:16, PostgreSQL 16.15

      # BUG-352: Docker Hub alone could block the pooler after Postgres failed over.
      # Refresh both pins per "CI's PgBouncer Image" in
      # docs/guides/dependencies/updating-dependencies.md.
      - name: Pull PgBouncer
        timeout-minutes: 7
        env:
          PGBOUNCER_IMAGE_DIGEST: sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624 # v1.26.1-p0, PgBouncer 1.26.1
        run: bash scripts/ci/pull-image.sh --env PGBOUNCER_IMAGE_REPOSITORY PgBouncer "$PGBOUNCER_IMAGE_DIGEST" docker.io/edoburu/pgbouncer mirror.gcr.io/edoburu/pgbouncer

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Start test database
        timeout-minutes: 3
        run: |
          # A plain assignment preserves the resolver exit status before export.
          target_env="$(pnpm exec tsx scripts/test-lanes/resolve-local-test-target.ts env)"
          COMPOSE_PROJECT_NAME="$(sed -n 's/^COMPOSE_PROJECT_NAME=//p' <<< "$target_env")"
          DB_TEST_POOLER_PORT="$(sed -n 's/^DB_TEST_POOLER_PORT=//p' <<< "$target_env")"
          : "${COMPOSE_PROJECT_NAME:?The resolver gave no Compose project}" "${DB_TEST_POOLER_PORT:?The resolver gave no pooler port}"
          export COMPOSE_PROJECT_NAME DB_TEST_POOLER_PORT
          printf 'COMPOSE_PROJECT_NAME=%s\nDB_TEST_POOLER_PORT=%s\n' "$COMPOSE_PROJECT_NAME" "$DB_TEST_POOLER_PORT" >> "$GITHUB_ENV"
          docker compose up -d --wait --wait-timeout 60 --pull never db pgbouncer

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and Format Check (Biome)
        run: pnpm lint:ci

      - name: Test-double fidelity
        run: pnpm lint:doubles

      - name: Migrate DB
        run: pnpm exec tsx scripts/internal/run-managed-db-migrate.ts

      - name: Seed DB (placeholder content)
        run: pnpm exec tsx scripts/internal/run-managed-db-seed.ts --include-placeholders

      - name: Unit tests with coverage
        id: unit_tests
        run: pnpm test:coverage

      - name: Integration tests
        id: integration_tests
        run: pnpm test:integration:coverage
        env:
          INTEGRATION_USE_EXISTING_DATABASE: 'true'

      - name: Install Playwright browsers
        timeout-minutes: 12
        run: bash scripts/ci/install-playwright-chromium.sh

      - name: Browser tests with coverage
        id: browser_tests
        run: pnpm test:browser:coverage

      # DEBT-497: a failed upload no longer hides behind a green step. It fails
      # this step without failing the job, and the next step reports it. The
      # merge guard, not CI, decides whether a missing codecov/patch blocks.
      - name: Upload coverage to Codecov
        id: codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Each lane's report by name, and nothing else: with search on, the
          # glob missed the unit report and only the search found it.
          files: ./coverage/coverage-final.json,./coverage/integration/coverage-final.json,./coverage/browser/coverage-final.json
          disable_search: true
          # No Xcode, gcov or coverage.py reports to generate.
          plugins: noop
          fail_ci_if_error: true

      - name: Report a failed Codecov upload
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        run: |
          echo "::warning title=Codecov upload failed::No coverage reached Codecov, so codecov/patch will not post on this head. scripts/review/merge-reviewed-pr.ts refuses until it does, unless every changed path is unmeasured (ADR-020). See the upload step's log and docs/guides/release/review-and-merge.md (When codecov/patch Is Missing)."
          {
            echo "### Codecov upload failed"
            echo ""
            echo "No coverage reached Codecov, so \`codecov/patch\` will not post on this head. See the upload step's log and docs/guides/release/review-and-merge.md (When codecov/patch Is Missing)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        id: build
        run: pnpm build
        env:
          # Build needs Clerk only when the matching public key is available.
          NEXT_PUBLIC_SKIP_CLERK: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY == '' && 'true' || 'false' }}
          CLERK_SECRET_KEY: sk_test_dummy
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_dummy' }}
          STRIPE_SECRET_KEY: sk_test_dummy
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_dummy' }}
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          NEXT_PUBLIC_STRIPE_PRICE_ID_MONTHLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ID_MONTHLY || 'price_dummy_monthly' }}
          NEXT_PUBLIC_STRIPE_PRICE_ID_ANNUAL: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ID_ANNUAL || 'price_dummy_annual' }}

      - name: E2E smoke
        id: e2e_smoke
        # Dependabot PRs do not receive repository secrets, even when their branch
        # lives in this repository. Keep E2E on for pushes, manual runs on main
        # (evidence for a production release, as a push run is) and human
        # same-repo PRs.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_SKIP_CLERK: 'false'
          E2E_USE_EXISTING_DATABASE: 'true'
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PRICE_ID_MONTHLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ID_MONTHLY }}
          NEXT_PUBLIC_STRIPE_PRICE_ID_ANNUAL: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ID_ANNUAL }}
          E2E_CLERK_USER_USERNAME: ${{ secrets.E2E_CLERK_USER_USERNAME }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
          # DEBT-508: each run attempt gets its own Stripe test customer, so
          # concurrent runs never change each other's subscriptions.
          E2E_STRIPE_OWNER: github-ci-${{ github.run_id }}-${{ github.run_attempt }}

      # BUG-328: every HTML report carries Clerk development tokens from the
      # setup steps, so it is never uploaded. A failed run uploads its failure
      # output only after this scan finds no token in it.
      # DEBT-510: Codecov sometimes processes the upload and never posts
      # codecov/patch, which the merge guard requires. Sending the
      # notification again here, minutes after the upload, gives it a second
      # trigger; Codecov still computes the result from the uploads, so this
      # cannot create a pass. A failure here is visible but never fails CI.
      - name: Send Codecov notifications
        if: ${{ !cancelled() && steps.codecov.outcome == 'success' }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          run_command: send-notifications
          fail_ci_if_error: true

      - name: Scan Playwright output
        id: playwright_output_scan
        if: ${{ !cancelled() && steps.e2e_smoke.outcome == 'failure' }}
        run: pnpm exec tsx scripts/ci/scan-playwright-output.ts test-results

      - name: Upload Playwright failure output
        if: ${{ !cancelled() && steps.e2e_smoke.outcome == 'failure' && steps.playwright_output_scan.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: |
            test-results/
            !**/.auth/**
            !**/trace.zip
          retention-days: 30
          if-no-files-found: ignore

      - name: Evidence summary
        if: ${{ !cancelled() }}
        env:
          UNIT_OUTCOME: ${{ steps.unit_tests.outcome }}
          INTEGRATION_OUTCOME: ${{ steps.integration_tests.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser_tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          E2E_OUTCOME: ${{ steps.e2e_smoke.outcome }}
          E2E_SKIP_REASON: ${{ github.actor == 'dependabot[bot]' && 'shared TEST credentials are withheld from Dependabot; main E2E gates production promotion' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'fork pull requests do not receive E2E credentials' || 'an earlier required step did not succeed') }}
        run: |
          set -euo pipefail

          printf '## Required CI evidence\n\n' >> "$GITHUB_STEP_SUMMARY"

          summarize() {
            local label="$1"
            local outcome="$2"
            local skipped_reason="$3"

            case "$outcome" in
              success)
                printf -- '- ✅ %s: executed and passed\n' "$label" >> "$GITHUB_STEP_SUMMARY"
                ;;
              failure)
                printf -- '- ❌ %s: executed and failed\n' "$label" >> "$GITHUB_STEP_SUMMARY"
                ;;
              skipped|'')
                printf -- '- ⚠️ %s: did not execute — %s\n' "$label" "$skipped_reason" >> "$GITHUB_STEP_SUMMARY"
                echo "::warning title=CI evidence missing::$label did not execute — $skipped_reason"
                ;;
              *)
                printf -- '- ⚠️ %s: outcome %s\n' "$label" "$outcome" >> "$GITHUB_STEP_SUMMARY"
                echo "::warning title=CI evidence unknown::$label reported outcome $outcome"
                ;;
            esac
          }

          summarize 'Unit tests' "$UNIT_OUTCOME" 'an earlier required step did not succeed'
          summarize 'Integration tests' "$INTEGRATION_OUTCOME" 'an earlier required step did not succeed'
          summarize 'Browser tests' "$BROWSER_OUTCOME" 'an earlier required step did not succeed'
          summarize 'Build' "$BUILD_OUTCOME" 'an earlier required step did not succeed'
          summarize 'E2E smoke' "$E2E_OUTCOME" "$E2E_SKIP_REASON"

      # DEBT-516: the runner printed a service container's log after the job;
      # Compose starts the database, so this step prints its log.
      - name: Postgres log
        if: ${{ !cancelled() }}
        run: docker compose logs --no-color db || true
