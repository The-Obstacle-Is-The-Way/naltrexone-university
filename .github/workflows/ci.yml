name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        image: postgres@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5 # postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: addiction_boards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d addiction_boards_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/addiction_boards_test

      # App base URL used by redirects / Playwright baseURL
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and Format Check (Biome)
        run: pnpm lint:ci

      - name: Test-double fidelity
        run: pnpm lint:doubles

      - name: Migrate DB
        run: pnpm exec tsx scripts/internal/run-managed-db-migrate.ts

      - name: Seed DB (placeholder content)
        run: pnpm exec tsx scripts/internal/run-managed-db-seed.ts
        env:
          SEED_INCLUDE_PLACEHOLDERS: 'true'

      - name: Unit tests with coverage
        id: unit_tests
        run: pnpm test:coverage

      - name: Integration tests
        id: integration_tests
        run: pnpm test:integration:coverage
        env:
          INTEGRATION_USE_EXISTING_DATABASE: 'true'

      - name: Install Playwright browsers
        timeout-minutes: 12
        run: bash scripts/ci/install-playwright-chromium.sh

      - name: Browser tests with coverage
        id: browser_tests
        run: pnpm test:browser:coverage

      # DEBT-497: a failed upload no longer hides behind a green step. It fails
      # this step without failing the job, and the next step reports it. The
      # merge guard, not CI, decides whether a missing codecov/patch blocks.
      - name: Upload coverage to Codecov
        id: codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/**/coverage-final.json
          fail_ci_if_error: true

      - name: Report a failed Codecov upload
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        run: |
          echo "::warning title=Codecov upload failed::No coverage reached Codecov, so codecov/patch will not post on this head. scripts/merge-reviewed-pr.ts refuses until it does, unless every changed path is unmeasured (ADR-020). See the upload step's log and AGENTS.md (Codecov outages)."
          {
            echo "### Codecov upload failed"
            echo ""
            echo "No coverage reached Codecov, so \`codecov/patch\` will not post on this head. See the upload step's log and AGENTS.md (Codecov outages)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        id: build
        run: pnpm build
        env:
          # Build needs Clerk only when the matching public key is available.
          NEXT_PUBLIC_SKIP_CLERK: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY == '' && 'true' || 'false' }}
          CLERK_SECRET_KEY: sk_test_dummy
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_dummy' }}
          STRIPE_SECRET_KEY: sk_test_dummy
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_dummy' }}
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          NEXT_PUBLIC_STRIPE_PRICE_ID_MONTHLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ID_MONTHLY || 'price_dummy_monthly' }}
          NEXT_PUBLIC_STRIPE_PRICE_ID_ANNUAL: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ID_ANNUAL || 'price_dummy_annual' }}

      - name: E2E smoke
        id: e2e_smoke
        # Dependabot PRs do not receive repository secrets, even when their branch
        # lives in this repository. Keep E2E on for pushes and human same-repo PRs.
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_SKIP_CLERK: 'false'
          E2E_USE_EXISTING_DATABASE: 'true'
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PRICE_ID_MONTHLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ID_MONTHLY }}
          NEXT_PUBLIC_STRIPE_PRICE_ID_ANNUAL: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ID_ANNUAL }}
          E2E_CLERK_USER_USERNAME: ${{ secrets.E2E_CLERK_USER_USERNAME }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
          # DEBT-508: each run attempt gets its own Stripe test customer, so
          # concurrent runs never change each other's subscriptions.
          E2E_STRIPE_OWNER: github-ci-${{ github.run_id }}-${{ github.run_attempt }}

      # BUG-328: every HTML report carries Clerk development tokens from the
      # setup steps, so it is never uploaded. A failed run uploads its failure
      # output only after this scan finds no token in it.
      # DEBT-510: Codecov sometimes processes the upload and never posts
      # codecov/patch, which the merge guard requires. Sending the
      # notification again here, minutes after the upload, gives it a second
      # trigger; Codecov still computes the result from the uploads, so this
      # cannot create a pass. A failure here is visible but never fails CI.
      - name: Send Codecov notifications
        if: ${{ !cancelled() && steps.codecov.outcome == 'success' }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          run_command: send-notifications
          fail_ci_if_error: true

      - name: Scan Playwright output
        id: playwright_output_scan
        if: ${{ !cancelled() && steps.e2e_smoke.outcome == 'failure' }}
        run: pnpm exec tsx scripts/ci/scan-playwright-output.ts test-results

      - name: Upload Playwright failure output
        if: ${{ !cancelled() && steps.e2e_smoke.outcome == 'failure' && steps.playwright_output_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: |
            test-results/
            !**/.auth/**
            !**/trace.zip
          retention-days: 30
          if-no-files-found: ignore

      - name: Evidence summary
        if: ${{ !cancelled() }}
        env:
          UNIT_OUTCOME: ${{ steps.unit_tests.outcome }}
          INTEGRATION_OUTCOME: ${{ steps.integration_tests.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser_tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          E2E_OUTCOME: ${{ steps.e2e_smoke.outcome }}
          E2E_SKIP_REASON: ${{ github.actor == 'dependabot[bot]' && 'shared TEST credentials are withheld from Dependabot; main E2E gates production promotion' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'fork pull requests do not receive E2E credentials' || 'an earlier required step did not succeed') }}
        run: |
          set -euo pipefail

          printf '## Required CI evidence\n\n' >> "$GITHUB_STEP_SUMMARY"

          summarize() {
            local label="$1"
            local outcome="$2"
            local skipped_reason="$3"

            case "$outcome" in
              success)
                printf -- '- ✅ %s: executed and passed\n' "$label" >> "$GITHUB_STEP_SUMMARY"
                ;;
              failure)
                printf -- '- ❌ %s: executed and failed\n' "$label" >> "$GITHUB_STEP_SUMMARY"
                ;;
              skipped|'')
                printf -- '- ⚠️ %s: did not execute — %s\n' "$label" "$skipped_reason" >> "$GITHUB_STEP_SUMMARY"
                echo "::warning title=CI evidence missing::$label did not execute — $skipped_reason"
                ;;
              *)
                printf -- '- ⚠️ %s: outcome %s\n' "$label" "$outcome" >> "$GITHUB_STEP_SUMMARY"
                echo "::warning title=CI evidence unknown::$label reported outcome $outcome"
                ;;
            esac
          }

          summarize 'Unit tests' "$UNIT_OUTCOME" 'an earlier required step did not succeed'
          summarize 'Integration tests' "$INTEGRATION_OUTCOME" 'an earlier required step did not succeed'
          summarize 'Browser tests' "$BROWSER_OUTCOME" 'an earlier required step did not succeed'
          summarize 'Build' "$BUILD_OUTCOME" 'an earlier required step did not succeed'
          summarize 'E2E smoke' "$E2E_OUTCOME" "$E2E_SKIP_REASON"
