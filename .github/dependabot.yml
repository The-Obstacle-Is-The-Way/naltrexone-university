version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        exclude-patterns:
          - '@biomejs/biome'
          - 'stripe'
        update-types:
          - minor
          - patch
      biome:
        applies-to: version-updates
        patterns:
          - '@biomejs/biome'
        update-types:
          - minor
          - patch
          - major
      stripe:
        # Split out per DEBT-393 precedent: a stripe SDK bump couples to a
        # billing-sensitive STRIPE_API_VERSION (lib/stripe.ts) upgrade that
        # needs changelog review + webhook/checkout verification, so it must
        # not block the routine minor/patch group.
        applies-to: version-updates
        patterns:
          - 'stripe'
        update-types:
          - minor
          - patch
          - major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '09:00'
      timezone: America/New_York
    commit-message:
      prefix: chore(deps)
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '09:00'
      timezone: America/New_York
    commit-message:
      prefix: chore(deps)
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
